name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: Public Vercel frontend origin
        required: true
        type: string
      api_url:
        description: Public Railway API origin
        required: true
        type: string
      expected_api_revision:
        description: Full Git SHA independently expected on the API deployment
        required: true
        type: string
      expected_frontend_revision:
        description: Full Git SHA independently expected on the frontend deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  verify:
    name: Verify deployed DocuForge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCUFORGE_FRONTEND_URL: ${{ inputs.frontend_url }}
      DOCUFORGE_API_URL: ${{ inputs.api_url }}
      DOCUFORGE_EXPECTED_API_REVISION: ${{ inputs.expected_api_revision }}
      DOCUFORGE_EXPECTED_FRONTEND_REVISION: ${{ inputs.expected_frontend_revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install DocuForge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify deployed release identity
        id: identity
        run: >-
          python -m docuforge.ops.release_identity
          --api-url "$DOCUFORGE_API_URL"
          --frontend-url "$DOCUFORGE_FRONTEND_URL"
          --expected-api-revision "$DOCUFORGE_EXPECTED_API_REVISION"
          --expected-frontend-revision "$DOCUFORGE_EXPECTED_FRONTEND_REVISION"
          --report-json release-identity.json
          --timeout 20
      - name: Verify public deployment
        id: smoke
        run: >-
          python -m docuforge.ops.deployment_smoke
          --frontend-url "$DOCUFORGE_FRONTEND_URL"
          --api-url "$DOCUFORGE_API_URL"
          --timeout 45
          --report-json production-smoke.json
      - name: Summarize public verification
        if: always()
        env:
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          python - <<'PY'
          from docuforge.ops.production_summary import main
          main()
          PY
