name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm run test
      - name: Build frontend
        env:
          DOCUFORGE_BUILD_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Verify built frontend identity
        env:
          DOCUFORGE_TEST_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const stamp = JSON.parse(readFileSync("dist/build-info.json", "utf8"));
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          assert.deepEqual(stamp, {schema_version: 1, service: "docuforge-frontend", version: pkg.version, revision: process.env.DOCUFORGE_TEST_REVISION});
          const html = readFileSync("dist/index.html", "utf8");
          assert.ok(html.includes(`name="docuforge-revision" content="${stamp.revision}"`));
          assert.ok(html.includes(`name="docuforge-version" content="${stamp.version}"`));
          '

  e2e:
    name: Full-stack E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install web application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web]"
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run full-stack browser tests
        run: npm run test:e2e
        working-directory: frontend

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]"
      - name: Run tests
        run: python -m pytest

  windows-storage-ownership:
    name: Windows durable storage ownership
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and web dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]"
      - name: Verify durable storage ownership and download concurrency
        run: >-
          python -m pytest tests/api/test_batch_storage_ownership.py
          tests/api/test_batch_download_validation_concurrency.py
          tests/api/test_batch_download_descriptor.py
          tests/api/test_batch_download_lifecycle.py

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "setuptools>=77" wheel pytest
      - name: Verify stamped and unstamped installed artifacts
        run: python -m pytest tests/ops/test_build_artifacts.py -v
      - name: Build source distribution and wheel
        run: python -m build
      - name: Verify distributions
        run: ls dist/*.tar.gz dist/*.whl
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  production-runtime:
    name: Production runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build production image
        env:
          DOCUFORGE_TEST_REVISION: ${{ github.sha }}
        run: docker build --build-arg DOCUFORGE_BUILD_REVISION="$DOCUFORGE_TEST_REVISION" -t docuforge-runtime-ci .
      - name: Verify packaged build identity as non-root
        env:
          DOCUFORGE_TEST_REVISION: ${{ github.sha }}
        run: >-
          docker run --rm
          -e DOCUFORGE_BUILD_REVISION=ffffffffffffffffffffffffffffffffffffffff
          -e RAILWAY_GIT_COMMIT_SHA=eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          docuforge-runtime-ci python -c
          'import os, sys; from docuforge.build_identity import identity, read_identity;
          from docuforge.version import package_version;
          assert os.getuid() != 0;
          assert read_identity() == identity(package_version(), sys.argv[1])'
          "$DOCUFORGE_TEST_REVISION"
      - name: Verify production engines
        run: docker run --rm docuforge-runtime-ci python -m docuforge.ops.runtime_smoke
      - name: Verify durable batch restart
        run: docker run --rm docuforge-runtime-ci python -m docuforge.ops.batch_persistence_smoke
      - name: Verify non-root execution
        run: test "$(docker run --rm docuforge-runtime-ci id -u)" != "0"
